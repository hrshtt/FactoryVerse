[pytest]
# tests/unit runs offline. tests/live needs a running Factorio instance and
# skips (a real SKIP, never a vacuous pass) when none is reachable.
testpaths = tests/unit tests/live
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --tb=short
    --strict-markers
    -W ignore::DeprecationWarning

asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

markers =
    live: needs a running Factorio instance (RCON); skipped offline
    slow: takes a significant amount of time

minversion = 8.0
